seed: 42
data:
  dnn_csv_path: data/raw/DNN-EdgeIIoT-dataset.csv
  pcap_dir: data/raw/pcaps
  num_clients: 10
  dirichlet_alpha: 0.3
  val_benign_fraction: 0.15
  test_fraction: 0.15
  normalize_per_client: true
  capture_repairs:
    MITM: data/processed/MITM_reextracted.csv
  normalized_clip: 10.0
  extended_features: true
  feature_cache: data/processed/encoded_extended.npz
  group_by_flow: true
  min_flows_per_class: 20
boosting:
  label_source: server_held_calibration_set
  calibration_fraction: 0.05
  num_boost_round: 300
  learning_rate: 0.05
  num_leaves: 31
  broadcast_every_n_rounds: 1
  update_every_n_rounds: 3
  min_sum_hessian_in_leaf: 1.0
  lambda_l2: 1.0
  update_num_boost_round: 50
  alert_budget_per_client: 50
  calibration_eval_fraction: 0.2
  class_weighting: sqrt
autoencoder:
  bottleneck_dim: 8
  hidden_dims:
  - 32
  - 16
  learning_rate: 0.001
  local_epochs: 5
  batch_size: 64
  anomaly_percentile: 97
  reconstruction_error_bins: 50
  reconstruction_error_range:
  - 0.0
  - 10.0
cascade:
  confidence_threshold: 0.7
  anomaly_confidence_clip:
  - 0.0
  - 1.0
fl:
  num_rounds: 20
  clients_per_round: 10
  local_epochs: 5
  strategy: custom_trust_filtered
robustness:
  trim_fraction: 0.15
  norm_clip_multiplier: 2.0
  mad_outlier_threshold: 3.0
  trust_ema_alpha: 0.3
  min_cosine_similarity: 0.0
  min_trust_score: 0.5
  attacker_example_count: max_client
sdn:
  block_confidence_threshold: 0.85
  rate_limit_confidence_threshold: 0.5
  controller_host: 127.0.0.1
  controller_port: 6653
  bridge_api_host: 127.0.0.1
  bridge_api_port: 8080
evaluation:
  poisoning_fractions:
  - 0.0
  - 0.2
  - 0.3
  - 0.4
  - 0.5
  output_dir: results/leakcheck
  zero_day_holdout_classes: []
  zero_day_max_holdout_rows: 5000
  convergence_tolerance: 0.1
logging:
  level: INFO
  log_dir: logs/leakcheck
  log_file: fl_ids.log
orchestration:
  artifact_dir: saved_models/leakcheck
  run_dir: runs/leakcheck/phase_a
  server_address: 127.0.0.1:9091
  live_state_path: /tmp/fl_ids_training_state.json
  pool_subsample_size: 60000
  malicious_fraction: 0.0
  fl_timeout_seconds: 3600
dl_classifier:
  hidden_dims:
  - 64
  - 32
  learning_rate: 0.001
  epochs: 15
  batch_size: 256
  dropout: 0.1
classifier_comparison:
  sample_size: 500000
  test_fraction: 0.2
